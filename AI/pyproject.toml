[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-driver-ai"
version = "0.1.0"
description = "自动驾驶 AI 训练框架、数据采集和 Center API 接入"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiohttp>=3.10,<4",
    "python-dotenv>=1,<2",
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.5",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "opencv-python>=4.10,<6 ; sys_platform == 'win32'",
    "pandas>=3.1.0",
    "pillow>=13.0.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "tensorboard>=2.21.0",
    "torch==2.14.1",
    "torchvision==0.29.1",
    "tqdm>=4.70.1",
    "vgamepad>=0.2.0,<0.3 ; sys_platform == 'win32'",
    "windows-capture>=2.0.1,<3 ; sys_platform == 'win32'",
]

[project.scripts]
auto-driver-ai = "src.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
