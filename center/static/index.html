<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Auto Driver · 服务中心</title>
  <style>
    :root { font-family: Inter, "Segoe UI", "Microsoft YaHei", sans-serif; color: #e9eef4; background: #0a0e13; font-synthesis: none; --line: #26313e; --muted: #98a7b9; --green: #91ebba; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    button, input, select { font: inherit; }
    button, select { border: 1px solid var(--line); border-radius: 8px; color: inherit; background: #17202b; min-height: 42px; padding: 9px 12px; }
    button { cursor: pointer; transition: background .12s, border-color .12s; }
    button:hover:enabled { background: #263647; border-color: #557088; }
    button:disabled, input:disabled { opacity: .45; cursor: default; }
    button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid #91ebba; outline-offset: 3px; }
    header { border-bottom: 1px solid var(--line); padding: 23px max(24px, calc((100vw - 1440px) / 2)); display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .brand { font-size: 20px; font-weight: 750; letter-spacing: 2px; }
    .brand span { color: var(--green); }
    .subtitle { color: var(--muted); margin-top: 6px; font-size: 12px; letter-spacing: 1px; }
    .pill { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; border: 1px solid var(--line); border-radius: 30px; padding: 8px 12px; white-space: nowrap; }
    .dot { width: 7px; height: 7px; background: #768291; border-radius: 50%; }
    .online .dot { background: var(--green); box-shadow: 0 0 10px #91ebba44; }
    main { max-width: 1488px; margin: auto; padding: 25px 24px 40px; }
    .connection { display: grid; grid-template-columns: minmax(200px, 1fr) auto; align-items: end; gap: 12px; padding: 18px; border: 1px solid var(--line); background: #101720; border-radius: 12px; margin-bottom: 20px; }
    label.field { display: grid; gap: 8px; color: var(--muted); font-size: 12px; }
    .field select { width: 100%; color: #e9eef4; font-size: 14px; }
    .workspace { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; align-items: start; }
    .panel { border: 1px solid var(--line); border-radius: 12px; background: #101720; overflow: hidden; }
    .panel-heading { padding: 17px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line); gap: 10px; }
    h1, h2 { font-size: 15px; margin: 0; font-weight: 600; }
    .eyebrow { font-size: 10px; color: var(--muted); letter-spacing: 1.5px; margin-bottom: 5px; }
    .video { background: #060a0f; aspect-ratio: 16 / 9; position: relative; display: flex; align-items: center; justify-content: center; }
    .video img { width: 100%; height: 100%; object-fit: contain; position: absolute; inset: 0; }
    .placeholder { text-align: center; padding: 24px; color: var(--muted); }
    .placeholder svg { display: block; margin: 0 auto 17px; color: #486079; }
    .placeholder strong { display: block; color: #c6d1dd; margin-bottom: 10px; font-size: 16px; }
    .placeholder p { margin: 0; line-height: 1.7; font-size: 13px; }
    .frame-note { padding: 12px 20px; color: var(--muted); display: flex; justify-content: space-between; font-size: 12px; gap: 12px; }
    .metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--line); border-top: 1px solid var(--line); }
    .metric { padding: 18px 15px; background: #101720; min-width: 0; }
    .metric .value { display: block; font-size: 19px; font-variant-numeric: tabular-nums; margin-bottom: 7px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .metric .label { color: var(--muted); font-size: 11px; }
    .controls { padding: 18px; }
    .control-hint { margin: 0 0 17px; font-size: 12px; color: var(--muted); line-height: 1.7; }
    .drive-pad { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-areas: ". throttle ." "left brake right"; gap: 8px; }
    .drive-pad button { min-height: 65px; touch-action: none; user-select: none; -webkit-user-select: none; padding: 8px 4px; }
    .drive-pad [data-control='throttle'] { grid-area: throttle; }
    .drive-pad [data-control='left'] { grid-area: left; }
    .drive-pad [data-control='brake'] { grid-area: brake; }
    .drive-pad [data-control='right'] { grid-area: right; }
    .drive-pad button span { display: block; font-size: 10px; color: var(--muted); margin-top: 6px; }
    button.held { border-color: var(--green); background: #224332; color: #bcfbd6; }
    .setting { margin-top: 22px; }
    .setting label { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; }
    input[type=range] { width: 100%; margin: 12px 0 0; accent-color: var(--green); }
    .buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; margin: 20px 0; }
    .buttons button { min-height: 39px; font-size: 12px; touch-action: none; user-select: none; -webkit-user-select: none; padding: 6px; }
    .keyboard { font-size: 12px; color: #b8c4d2; display: flex; gap: 9px; align-items: center; line-height: 1.5; }
    .keyboard input { accent-color: var(--green); width: 16px; height: 16px; }
    .release { width: 100%; margin-top: 20px; color: #ffb6b6; border-color: #734142; background: #301c23; font-weight: 650; }
    .release:hover:enabled { background: #4b2630; border-color: #c87276; }
    .status-box { border-top: 1px solid var(--line); padding: 15px 18px; font-size: 12px; color: var(--muted); line-height: 1.7; overflow-wrap: anywhere; }
    .status-box strong { color: #cbd7e3; font-weight: 500; }
    .notice { margin-top: 18px; min-height: 42px; padding: 12px 15px; font-size: 13px; border: 1px solid var(--line); background: #101720; border-radius: 8px; color: var(--muted); line-height: 1.6; }
    .notice.error { color: #ffb6b6; border-color: #734142; background: #22151c; }
    footer { margin-top: 20px; color: #6f8195; font-size: 11px; line-height: 1.8; }
    @media (max-width: 1000px) { .workspace { grid-template-columns: minmax(0, 1fr) 280px; } .connection { grid-template-columns: minmax(150px, 1fr) auto; } }
    @media (max-width: 740px) { header { padding: 20px 16px; } main { padding: 18px 16px 30px; } .workspace { grid-template-columns: 1fr; } .connection { padding: 14px; } .metric { padding: 14px 10px; } .metric .value { font-size: 16px; } .controls { padding: 18px 22px; } .drive-pad button { min-height: 58px; } .brand { font-size: 17px; } }
  </style>
</head>
<body>
  <header>
    <div><div class="brand">AUTO <span>DRIVER</span></div><div class="subtitle">自动驾驶服务中心 / FORZA HORIZON 5</div></div>
    <div class="pill" id="connection-status" role="status"><span class="dot"></span><span id="connection-text">等待连接</span></div>
  </header>
  <main>
    <div class="connection">
      <label class="field" for="terminal">游戏终端<select id="terminal" disabled><option value="">等待终端上线</option></select></label>
      <button type="button" id="refresh">刷新终端</button>
    </div>
    <div class="workspace">
      <section class="panel" aria-label="实时游戏画面">
        <div class="panel-heading"><div><div class="eyebrow">LIVE OBSERVATION</div><h1 id="terminal-name">游戏画面</h1></div><span class="pill" id="stream-status">未连接</span></div>
        <div class="video">
          <div class="placeholder" id="placeholder"><svg width="52" height="42" viewBox="0 0 52 42" fill="none" aria-hidden="true"><rect x="2" y="2" width="48" height="31" rx="4" stroke="currentColor" stroke-width="2"/><path d="M17 40h18M26 33v7M20 13l13 6-13 6V13Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg><strong id="placeholder-title">等待游戏画面</strong><p id="placeholder-detail">终端上线后，画面会自动显示。</p></div>
          <img id="frame" alt="游戏终端实时画面" hidden>
        </div>
        <div class="frame-note"><span id="frame-time">尚未接收画面</span><span>JPEG · 实时预览</span></div>
        <div class="metrics">
          <div class="metric"><span class="value" id="resolution">—</span><span class="label">画面尺寸</span></div>
          <div class="metric"><span class="value" id="fps">—</span><span class="label">采集帧率</span></div>
          <div class="metric"><span class="value" id="sequence">—</span><span class="label">最新帧编号</span></div>
          <div class="metric"><span class="value" id="command-status">待命</span><span class="label">手柄指令</span></div>
        </div>
      </section>
      <aside class="panel" aria-label="手动控制">
        <div class="panel-heading"><div><div class="eyebrow">MANUAL CONTROL</div><h2>驾驶控制</h2></div><span aria-hidden="true">↗</span></div>
        <div class="controls">
          <p class="control-hint">按住发送操作，松开释放。每条操作自动到期；离开页面或窗口失焦时释放输入。</p>
          <div class="drive-pad">
            <button type="button" class="drive" data-control="throttle" disabled>↑ 油门<span>W / ↑</span></button>
            <button type="button" class="drive" data-control="left" disabled>← 左转<span>A / ←</span></button>
            <button type="button" class="drive" data-control="brake" disabled>↓ 刹车<span>S / ↓</span></button>
            <button type="button" class="drive" data-control="right" disabled>右转 →<span>D / →</span></button>
          </div>
          <div class="setting"><label for="throttle-level">油门强度 <output id="throttle-value">60%</output></label><input id="throttle-level" type="range" min="0" max="100" value="60"></div>
          <div class="setting"><label for="steering-level">转向幅度 <output id="steering-value">70%</output></label><input id="steering-level" type="range" min="0" max="100" value="70"></div>
          <div class="buttons" aria-label="手柄按键">
            <button type="button" class="drive" data-control="A" disabled>A</button><button type="button" class="drive" data-control="B" disabled>B</button><button type="button" class="drive" data-control="X" disabled>X</button><button type="button" class="drive" data-control="Y" disabled>Y</button>
            <button type="button" class="drive" data-control="LB" disabled>LB</button><button type="button" class="drive" data-control="RB" disabled>RB</button><button type="button" class="drive" data-control="BACK" disabled>BACK</button><button type="button" class="drive" data-control="START" disabled>START</button>
          </div>
          <label class="keyboard"><input type="checkbox" id="keyboard">启用键盘驾驶（WASD / 方向键）</label>
          <button type="button" class="release" id="release" disabled>■ 全部释放 / SPACE</button>
        </div>
        <div class="status-box"><strong>终端状态</strong><br><span id="hardware-status">等待终端连接</span></div>
      </aside>
    </div>
    <div class="notice" id="notice" role="status" aria-live="polite">正在获取终端状态。终端上线后会自动显示画面。</div>
    <footer>训练程序可通过中心 API 获取画面、发送动作并等待执行确认。手动驾驶与训练程序共享同一虚拟手柄，请安排好控制时段。</footer>
  </main>
  <script>
    'use strict';
    const $ = (id) => document.getElementById(id);
    let terminals = [];
    let selected = '';
    let centerOnline = false;
    let connectionEpoch = 0;
    let selectionEpoch = 0;
    let refreshRunning = false;
    let frameAbort = null;
    let frameUrl = null;
    let pageLeaving = false;
    const held = new Map();
    const releases = [];
    let pendingAction = null;
    let commandRunning = false;
    let sessionRecovery = null;
    const driveButtons = [...document.querySelectorAll('[data-control]')];
    const keyControls = new Map([['KeyW', 'throttle'], ['ArrowUp', 'throttle'], ['KeyS', 'brake'], ['ArrowDown', 'brake'], ['KeyA', 'left'], ['ArrowLeft', 'left'], ['KeyD', 'right'], ['ArrowRight', 'right']]);
    const delay = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
    function notice(message, error = false) { $('notice').textContent = message; $('notice').classList.toggle('error', error); }
    function currentTerminal() { return terminals.find((terminal) => terminal.terminal_id === selected); }
    function canControl() { return centerOnline && !!selected && currentTerminal()?.connected === true && !pageLeaving; }
    async function recoverSession() {
      if (!sessionRecovery) {
        sessionRecovery = (async () => {
          const controller = new AbortController();
          const timeout = setTimeout(() => controller.abort(), 6000);
          try {
            const response = await fetch('/dashboard-session', { credentials: 'same-origin', signal: controller.signal, cache: 'no-store' });
            if (!response.ok) throw new Error('中心暂时不可用，正在等待恢复。');
          } finally { clearTimeout(timeout); }
        })().finally(() => { sessionRecovery = null; });
      }
      return sessionRecovery;
    }
    async function centerFetch(path, options = {}) {
      const { retryGuard, ...fetchOptions } = options;
      const request = { ...fetchOptions, credentials: 'same-origin', cache: 'no-store' };
      let response = await fetch(path, request);
      if (response.status === 401 && !pageLeaving) {
        await recoverSession();
        if (retryGuard && !retryGuard()) {
          const error = new Error('Action superseded'); error.superseded = true; throw error;
        }
        response = await fetch(path, request);
      }
      return response;
    }
    async function api(path, options = {}) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 6000);
      try {
        const response = await centerFetch(path, { ...options, signal: controller.signal });
        if (!response.ok) {
          let message = `请求失败（${response.status}）`;
          try { const body = await response.json(); message = body.error || body.message || message; } catch (_) { /* Response need not be JSON. */ }
          const error = new Error(message); error.status = response.status; throw error;
        }
        return response;
      } finally { clearTimeout(timer); }
    }
    function syncControls() {
      const enabled = canControl();
      const values = new Set(held.values());
      for (const button of driveButtons) {
        button.disabled = !enabled;
        const active = values.has(button.dataset.control);
        button.classList.toggle('held', active);
        button.setAttribute('aria-pressed', String(active));
      }
      $('release').disabled = !enabled;
      $('connection-status').classList.toggle('online', centerOnline);
      $('connection-text').textContent = centerOnline ? `${terminals.filter((t) => t.connected).length} 个终端在线` : '正在连接';
    }
    function actionState() {
      const controls = new Set(held.values());
      return {
        steering: ((controls.has('right') ? 1 : 0) - (controls.has('left') ? 1 : 0)) * Number($('steering-level').value) / 100,
        throttle: controls.has('throttle') ? Number($('throttle-level').value) / 100 : 0,
        brake: controls.has('brake') ? 1 : 0,
        buttons: [...controls].filter((value) => !['throttle', 'brake', 'left', 'right'].includes(value)),
        duration_ms: 250,
      };
    }
    function queueAction() {
      if (!canControl() || !held.size) return;
      pendingAction = { id: selected, action: actionState(), release: false };
      void drainCommands();
    }
    function queueRelease(id = selected) {
      if (!id) return;
      if (pendingAction?.id === id) pendingAction = null;
      if (!releases.some((work) => work.id === id)) releases.push({ id, release: true });
      void drainCommands();
    }
    async function drainCommands() {
      if (commandRunning) return;
      commandRunning = true;
      try {
        while (releases.length || pendingAction) {
          const work = releases.shift() || pendingAction;
          if (!work.release) pendingAction = null;
          try {
            await api(`/api/terminals/${encodeURIComponent(work.id)}/${work.release ? 'release' : 'actions'}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(work.release ? {} : work.action), keepalive: work.release,
              retryGuard: () => work.release || (canControl() && selected === work.id && held.size > 0 && JSON.stringify(actionState()) === JSON.stringify(work.action)),
            });
            if (selected === work.id) $('command-status').textContent = work.release ? '已释放' : '已确认';
          } catch (error) {
            if (error.superseded) continue;
            if (selected === work.id) {
              $('command-status').textContent = '执行失败';
              notice(`控制失败：${error.message}。终端会在指令到期后释放输入。`, true);
              held.clear(); syncControls();
            }
            if (!work.release) queueRelease(work.id);
          }
        }
      } finally { commandRunning = false; }
    }
    function stopControls() { held.clear(); syncControls(); queueRelease(); }
    function setHeld(source, control) {
      if (!canControl()) return;
      held.set(source, control); syncControls(); queueAction();
    }
    function clearHeld(source) {
      if (!held.delete(source)) return;
      syncControls();
      if (held.size) queueAction(); else queueRelease();
    }
    function clearFrame(title = '等待游戏画面', detail = '终端上线并成功采集游戏窗口后，画面会自动显示。') {
      $('frame').hidden = true; $('frame').removeAttribute('src');
      if (frameUrl) { URL.revokeObjectURL(frameUrl); frameUrl = null; }
      $('placeholder').hidden = false;
      $('placeholder-title').textContent = title; $('placeholder-detail').textContent = detail;
      $('frame-time').textContent = '尚未接收画面'; $('sequence').textContent = '—';
    }
    function renderTerminal() {
      const terminal = currentTerminal();
      $('terminal-name').textContent = terminal?.name || '游戏画面';
      $('stream-status').textContent = terminal?.connected ? '终端在线' : '未连接';
      const capture = terminal?.status?.capture || terminal?.capture || {};
      const width = terminal?.width || capture.width;
      const height = terminal?.height || capture.height;
      $('resolution').textContent = width && height ? `${width} × ${height}` : '—';
      $('fps').textContent = capture.fps ? `${Number(capture.fps).toFixed(0)} FPS` : '—';
      const status = terminal?.status || {};
      const captureError = status.capture?.error;
      const controlError = status.control?.error;
      const mock = status.mock || status.capture?.mock || terminal?.capabilities?.includes('mock');
      $('hardware-status').textContent = !terminal ? '等待终端连接' : !terminal.connected ? '终端已离线，等待自动重连' : [mock ? '模拟终端' : '已连接', captureError ? `采集：${captureError}` : '', controlError ? `手柄：${controlError}` : ''].filter(Boolean).join(' · ');
      syncControls();
    }
    function selectTerminal(id) {
      const previous = selected;
      if (previous === id) { renderTerminal(); return; }
      held.clear();
      queueRelease(previous);
      selected = id; selectionEpoch += 1;
      if (frameAbort) frameAbort.abort();
      clearFrame(); $('command-status').textContent = '待命';
      renderTerminal();
      if (selected && currentTerminal()?.connected) void pollFrames(selectionEpoch, connectionEpoch);
    }
    async function refreshTerminals() {
      if (refreshRunning || pageLeaving) return;
      refreshRunning = true;
      const epoch = connectionEpoch;
      try {
        const response = await api('/api/terminals');
        const body = await response.json();
        if (epoch !== connectionEpoch || pageLeaving) return;
        const wasOnline = centerOnline;
        const wasConnected = currentTerminal()?.connected;
        terminals = Array.isArray(body.terminals) ? body.terminals : [];
        centerOnline = true;
        const previous = selected;
        const next = terminals.some((t) => t.terminal_id === previous && t.connected) ? previous : (terminals.find((t) => t.connected)?.terminal_id || '');
        $('terminal').replaceChildren();
        if (!terminals.length) $('terminal').add(new Option('等待终端上线', ''));
        for (const terminal of terminals) $('terminal').add(new Option(`${terminal.name || terminal.terminal_id}${terminal.connected ? '' : '（离线）'}`, terminal.terminal_id));
        $('terminal').disabled = !terminals.length;
        $('terminal').value = next;
        selectTerminal(next);
        if (previous === next && next && (!wasConnected || !wasOnline) && currentTerminal()?.connected) { selectionEpoch += 1; void pollFrames(selectionEpoch, connectionEpoch); }
        if (!next) notice('等待游戏终端上线，上线后将自动显示画面。');
        else if (!wasOnline) notice('已接入游戏终端。按住驾驶按钮发送操作。');
      } catch (error) {
        if (epoch !== connectionEpoch || pageLeaving) return;
        centerOnline = false; held.clear(); queueRelease();
        selectionEpoch += 1; if (frameAbort) frameAbort.abort();
        clearFrame('中心连接中断', '连接恢复后将自动重新获取游戏画面。');
        notice(`连接中心失败：${error.message}，正在自动重试。`, true);
        syncControls();
      } finally { refreshRunning = false; }
    }
    async function pollFrames(epoch, connectionVersion) {
      const id = selected;
      let lastSequence = '';
      while (epoch === selectionEpoch && connectionVersion === connectionEpoch && id === selected && !pageLeaving) {
        if (document.hidden) { await delay(300); continue; }
        const started = performance.now();
        const controller = new AbortController(); frameAbort = controller;
        const timeout = setTimeout(() => controller.abort(), 5000);
        try {
          const response = await centerFetch(`/api/terminals/${encodeURIComponent(id)}/frame`, { signal: controller.signal });
          if (!response.ok) {
            if (epoch !== selectionEpoch || connectionVersion !== connectionEpoch) break;
            clearFrame(response.status === 503 ? '等待终端采集画面' : '画面暂不可用', response.status === 503 ? '请确认游戏窗口已打开，终端正在采集。' : '检查终端状态和网络连接，页面会自动重试。');
            $('stream-status').textContent = '等待画面';
            await delay(500); continue;
          }
          const blob = await response.blob();
          if (epoch !== selectionEpoch || connectionVersion !== connectionEpoch) break;
          const sequence = response.headers.get('X-Frame-Sequence') || '';
          if (sequence !== lastSequence || !frameUrl) {
            const nextUrl = URL.createObjectURL(blob);
            const oldUrl = frameUrl;
            frameUrl = nextUrl; $('frame').src = nextUrl;
            if (oldUrl) URL.revokeObjectURL(oldUrl);
            $('frame').hidden = false; $('placeholder').hidden = true;
            $('sequence').textContent = sequence || '—'; lastSequence = sequence;
          }
          const timestamp = Number(response.headers.get('X-Frame-Timestamp'));
          $('frame-time').textContent = timestamp ? `画面时间 ${new Date(timestamp * 1000).toLocaleTimeString('zh-CN', { hour12: false })}` : '已接收游戏画面';
          $('stream-status').textContent = '正在接收';
        } catch (error) {
          if (epoch !== selectionEpoch || connectionVersion !== connectionEpoch || pageLeaving) break;
          clearFrame('画面连接中断', '正在重试，请检查终端是否在线。');
          $('stream-status').textContent = '正在重试';
          await delay(500);
        } finally { clearTimeout(timeout); if (frameAbort === controller) frameAbort = null; }
        await delay(Math.max(0, 125 - (performance.now() - started)));
      }
    }
    $('refresh').addEventListener('click', () => { void refreshTerminals(); });
    $('terminal').addEventListener('change', () => selectTerminal($('terminal').value));
    $('release').addEventListener('click', stopControls);
    $('keyboard').addEventListener('change', stopControls);
    for (const name of ['throttle', 'steering']) $('' + name + '-level').addEventListener('input', () => { $(name + '-value').textContent = `${$(name + '-level').value}%`; queueAction(); });
    for (const button of driveButtons) {
      button.addEventListener('pointerdown', (event) => {
        if (event.button !== 0 || !canControl()) return;
        event.preventDefault(); button.setPointerCapture(event.pointerId);
        setHeld(`pointer:${event.pointerId}`, button.dataset.control);
      });
      const releasePointer = (event) => clearHeld(`pointer:${event.pointerId}`);
      button.addEventListener('pointerup', releasePointer);
      button.addEventListener('pointercancel', releasePointer);
      button.addEventListener('lostpointercapture', releasePointer);
      button.addEventListener('contextmenu', (event) => event.preventDefault());
      button.addEventListener('keydown', (event) => {
        if (event.code !== 'Enter' || !canControl()) return;
        event.preventDefault();
        if (!event.repeat) setHeld(`button:${button.dataset.control}`, button.dataset.control);
      });
      button.addEventListener('keyup', (event) => {
        if (event.code !== 'Enter') return;
        event.preventDefault(); clearHeld(`button:${button.dataset.control}`);
      });
      button.addEventListener('blur', () => clearHeld(`button:${button.dataset.control}`));
    }
    function isEditing(target, code) {
      if (!(target instanceof Element)) return false;
      const field = target.closest('input, select, textarea, [contenteditable="true"]');
      if (!field) return false;
      if (field.tagName === 'INPUT' && ['checkbox', 'radio', 'button', 'submit', 'reset'].includes(field.type)) return false;
      if (field.tagName === 'INPUT' && field.type === 'range') return ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Home', 'End', 'PageUp', 'PageDown'].includes(code);
      return true;
    }
    window.addEventListener('keydown', (event) => {
      if (!canControl() || event.altKey || event.ctrlKey || event.metaKey) return;
      if (event.code === 'Space') { event.preventDefault(); stopControls(); return; }
      if (isEditing(event.target, event.code)) return;
      if (!$('keyboard').checked || !keyControls.has(event.code)) return;
      event.preventDefault(); if (!event.repeat) setHeld(`key:${event.code}`, keyControls.get(event.code));
    });
    window.addEventListener('keyup', (event) => { if (held.has(`key:${event.code}`)) { event.preventDefault(); clearHeld(`key:${event.code}`); } });
    window.addEventListener('blur', stopControls);
    document.addEventListener('visibilitychange', () => { if (document.hidden) stopControls(); });
    window.addEventListener('pagehide', () => { stopControls(); pageLeaving = true; selectionEpoch += 1; connectionEpoch += 1; if (frameAbort) frameAbort.abort(); });
    window.addEventListener('pageshow', () => {
      if (pageLeaving) {
        pageLeaving = false; centerOnline = false; syncControls();
        void refreshTerminals();
      }
    });
    setInterval(() => { if (held.size) queueAction(); }, 100);
    setInterval(() => { if (!document.hidden) void refreshTerminals(); }, 2000);
    syncControls();
    void refreshTerminals();
  </script>
</body>
</html>
