[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-driver-terminal"
version = "0.1.0"
description = "Windows Forza Horizon 5 capture and virtual Xbox 360 network terminal"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiohttp>=3.10,<4",
    "Pillow>=11,<14",
    "opencv-python>=4.10,<6 ; sys_platform == 'win32'",
    "vgamepad>=0.2.0,<0.3 ; sys_platform == 'win32'",
    "windows-capture>=2.0.1,<3 ; sys_platform == 'win32'",
    "python-dotenv>=1,<2",
    "imageio-ffmpeg>=0.6,<0.7",
]

[project.scripts]
auto-driver-terminal = "terminal.__main__:main"

[tool.setuptools]
packages = ["terminal", "terminal.config", "terminal.capture", "terminal.control", "terminal.network", "terminal.video", "terminal.services"]
package-dir = {terminal = "."}
